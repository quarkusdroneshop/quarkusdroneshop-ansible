---
# defaults file for quarkusdroneshop-demo-role
openshift_token: 1234567890
openshift_url: https://api.ocp4.example.com:6443
default_owner: root
default_group: root
insecure_skip_tls_verify: true
project_namespace: quarkusdroneshop-demo
delete_deployment: false
amqchannel: stable
consolechannel: stable
# amqstartingCSV, consolestartingCSV and crunchystartingCSV are resolved at
# runtime from the operator's PackageManifest (see amq-streams-install.yml /
# crunchy-operator-install.yml) so they always track the latest CSV in the
# configured channel instead of a pinned version.
config_location: "/tmp/"
kafka_cluster_name: shop-cluster
domain: ocp4.example.com
ocp_apps_domain: "apps.{{ domain }}"
branch: master # for developmemt change to dev

# Helm Chart Version 
helm_chart_version: 3.5.0

# Application Versions 
version_QDCA10: 5.0.0-SNAPSHOT
version_counter: 5.0.3-SNAPSHOT
version_customermocker: 5.0.1-SNAPSHOT
version_inventory: 5.0.0-SNAPSHOT
version_QDCA10Pro: 5.0.0-SNAPSHOT
version_web: 5.0.3-SNAPSHOT
version_customerloyalty: 5.0.1-SNAPSHOT

# replica count 
replica_counter: 1
replica_customermocker: 1
replica_inventory: 1
replica_QDCA10: 1
replica_QDCA10Pro: 1
replica_web: 1
replica_customerloyalty: 1

# Postgres database information
postgres_version: 17
pgsql_username: droneshopadmin
original_secret: postgres
postgres_password: postgres
postgres_hostname: "droneshopdb-primary.{{ project_namespace }}.svc"
pgsql_url: 'jdbc:postgresql://droneshopdb:5432/droneshopdb?currentSchema=droneshop'

# pgAdmin Database values 
pgadmin_setup_email: nmushino@redhat.com
pgadmin_default_password: postgres
pgadmin_setup_password: postgres

# Apicurio Registry information
registry_channel: 2.x
registry_starting_csv: service-registry-operator.v2.6.13-r2-0.1763986602.p

# Store ID
storeid: TOKYO

#Quarkus counter logging level
quarkus_log_level: INFO
quarkusdroneshop_log_level: DEBUG

# OpenShift Storage
odf_version: "stable-4.12"

# Settings for ACM (Advanced Cluster Management) multi-cluster hub
# acm_channel / acmstartingCSV are resolved at runtime from the operator's
# PackageManifest (see acm-multicluster.yml) so they always track the
# latest CSV in the operator's default channel instead of a pinned version.
