# Aサイト(quarkusdroneshop-web / quarkusdroneshop-counter)の REST API を
# api.__DOMAIN_NAME__ 経由で公開する HTTPRoute。
# Service 名は quarkusdroneshop-{web,counter} リポジトリの Deployment に合わせて
# "web" / "counter"(namespace: __APP_NAMESPACE__)。
# PathPrefix マッチはデフォルトではプレフィックスを剥がさずそのまま backend に転送する
# ため、URLRewrite (ReplacePrefixMatch) でアプリ側の実パス(/ 始まり)に書き換える。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-web
  namespace: __NAMESPACE__
spec:
  parentRefs:
    - name: mcp-gateway
      sectionName: api-https
  hostnames:
    - "api.__DOMAIN_NAME__"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/web
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: web
          namespace: __APP_NAMESPACE__
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-counter
  namespace: __NAMESPACE__
spec:
  parentRefs:
    - name: mcp-gateway
      sectionName: api-https
  hostnames:
    - "api.__DOMAIN_NAME__"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/counter
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: counter
          namespace: __APP_NAMESPACE__
          port: 8080
