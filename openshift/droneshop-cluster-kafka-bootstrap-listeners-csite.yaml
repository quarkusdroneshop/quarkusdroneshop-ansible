apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: shop-cluster
  namespace: quarkusdroneshop-demo
  annotations:
   strimzi.io/kraft: enabled
spec:
  kafka:
    version: "4.1.0"
    replicas: 3
    controllerReplicas: 3
    config:
      process.roles: "controller,broker"
      controller.listener.names: CONTROLLER
      log.dirs: "/var/lib/kafka/data"
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
      - name: external
        port: 9094
        type: loadbalancer
        tls: false
        configuration:
          bootstrap:
            advertisedHost: ab7e4a73adaa048a6af8eb84a9428ba1-1432290040.us-east-2.elb.amazonaws.com
            advertisedPort: 9094
          brokers:
            - broker: 0
              advertisedHost: a52130e1c27324238aa1a2d36406b7c6-1649045748.us-east-2.elb.amazonaws.com
              advertisedPort: 9094
            - broker: 1
              advertisedHost: a0a409cda0a6e450db1cc37292ac1d09-1646729125.us-east-2.elb.amazonaws.com
              advertisedPort: 9094
            - broker: 2
              advertisedHost: a7b977abd64d24188844058675a2ba6f-881490640.us-east-2.elb.amazonaws.com
              advertisedPort: 9094
  entityOperator:
    topicOperator: {}
    userOperator: {}
