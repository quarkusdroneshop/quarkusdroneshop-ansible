apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamic-plugins-rhdh
  namespace: quarkusdroneshop-rhdh
  annotations:
    rhdh.redhat.com/backstage-name: developer-hub

data:
  dynamic-plugins.yaml: |
    includes:
      - dynamic-plugins.default.yaml

    plugins:

      - package: './dynamic-plugins/dist/backstage-plugin-catalog-backend-module-github-dynamic'
        disabled: false

      - package: './dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-github-dynamic'
        disabled: false

      - package: './dynamic-plugins/dist/backstage-community-plugin-scaffolder-backend-module-kubernetes-dynamic'
        disabled: false

      # Kubernetes プラグイン（クラスタートポロジー表示）
      - package: './dynamic-plugins/dist/backstage-plugin-kubernetes-backend-dynamic'
        disabled: false

      - package: './dynamic-plugins/dist/backstage-plugin-kubernetes'
        disabled: false

      # OpenShift トポロジープラグイン
      - package: './dynamic-plugins/dist/backstage-community-plugin-topology'
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              backstage-community.plugin-topology:
                mountPoints:
                  - mountPoint: entity.page.topology/cards
                    importName: TopologyPage
                    config:
                      layout:
                        gridColumn: "1 / -1"
                        gridRowStart: 1
                      if:
                        anyOf:
                          - hasAnnotation: backstage.io/kubernetes-id
                          - hasAnnotation: backstage.io/kubernetes-namespace
                entityTabs:
                  - path: /topology
                    title: Topology
                    mountPoint: entity.page.topology

      # Tekton CI プラグイン（CI タブでパイプライン状況表示）
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-tekton:bs_1.49.4__3.37.0!backstage-community-plugin-tekton'
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              backstage-community.plugin-tekton:
                mountPoints:
                  - mountPoint: entity.page.ci/cards
                    importName: TektonCI
                    config:
                      layout:
                        gridColumn: "1 / -1"
                      if:
                        allOf:
                          - hasAnnotation: tektonci.io/pipeline
                entityTabs:
                  - path: /ci
                    title: CI
                    mountPoint: entity.page.ci

      - package: './dynamic-plugins/dist/roadiehq-scaffolder-backend-module-http-request-dynamic'
        disabled: false


      # Test Report プラグイン（内部HTTPサーバーからtgz配信）
      - package: 'http://plugin-proxy-server.quarkusdroneshop-rhdh.svc.cluster.local:8080/internal-plugin-test-report-dynamic-0.1.0.tgz'
        disabled: false
        integrity: 'sha512-QQ/q+nRQI4tOHYce9TL6RPVfVVPUPCnXYfYgM5k0uYY9Yu5qFaKaG4nS7lHcIOjTV6k3T6yM0HuMlNwLFm5+ZQ=='
        pluginConfig:
          dynamicPlugins:
            frontend:
              internal.plugin-test-report:
                mountPoints:
                  - mountPoint: entity.page.test-report/cards
                    importName: TestReportContent
                    config:
                      layout:
                        gridColumn: "1 / -1"
                      if:
                        allOf:
                          - isKind: component
                entityTabs:
                  - path: /test-report
                    title: Test Report
                    mountPoint: entity.page.test-report

      # データカタログ プラグイン（OpenMetadata Explore へのリンク）
      - package: 'http://plugin-proxy-server.quarkusdroneshop-rhdh.svc.cluster.local:8080/internal-plugin-data-catalog-dynamic-0.1.0.tgz'
        disabled: false
        integrity: 'sha512-1z+ZLoYVGZQSUcZfFuw59vYZdp50d9U3FLMp/wngTpHDSXc8C5ZBSTmCWXj0mcF6ElmUKDouAZMMAEo2gzghLA=='
        pluginConfig:
          dynamicPlugins:
            frontend:
              internal.plugin-data-catalog:
                mountPoints:
                  - mountPoint: entity.page.data-catalog/cards
                    importName: DataCatalogContent
                    config:
                      layout:
                        gridColumn: "1 / -1"
                      if:
                        anyOf:
                          - isKind: resource
                          - isKind: api
                entityTabs:
                  - path: /data-catalog
                    title: データカタログ
                    mountPoint: entity.page.data-catalog

