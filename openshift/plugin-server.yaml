apiVersion: apps/v1
kind: Deployment
metadata:
  name: plugin-proxy-server
  namespace: quarkusdroneshop-rhdh
  labels:
    app: plugin-proxy-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plugin-proxy-server
  template:
    metadata:
      labels:
        app: plugin-proxy-server
    spec:
      initContainers:
        - name: pack-plugins
          image: image-registry.openshift-image-registry.svc:5000/quarkusdroneshop-rhdh/rhdh-hub-custom:latest
          command:
            - sh
            - -c
            - |
              set -e
              cd /opt/app-root/src/dynamic-plugins/dist/internal-plugin-test-report
              tar czf /tarball/internal-plugin-test-report-dynamic-0.1.0.tgz \
                --sort=name --mtime='UTC 2024-01-01' \
                --transform s,^,package/, dist-scalprum package.json
              echo "test-report OK"
              cd /opt/app-root/src/dynamic-plugins/dist/internal-plugin-data-catalog
              tar czf /tarball/internal-plugin-data-catalog-dynamic-0.1.0.tgz \
                --sort=name --mtime='UTC 2024-01-01' \
                --transform s,^,package/, dist-scalprum package.json
              echo "data-catalog OK"
          volumeMounts:
            - name: tarball
              mountPath: /tarball
      containers:
        - name: httpd
          image: busybox
          command:
            - sh
            - -c
            - |
              cd /tarball
              echo "Serving plugins:"
              ls -lh /tarball/
              httpd -f -p 8080 -h /tarball
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: tarball
              mountPath: /tarball
      volumes:
        - name: tarball
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: plugin-proxy-server
  namespace: quarkusdroneshop-rhdh
spec:
  selector:
    app: plugin-proxy-server
  ports:
    - port: 8080
      targetPort: 8080
