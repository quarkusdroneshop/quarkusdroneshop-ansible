apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: developer-hub
  namespace: quarkusdroneshop-rhdh

spec:
  application:
    replicas: 1

    route:
      enabled: true

    database:
      enableLocalDb: true

    appConfig:
      mountPath: /opt/app-root/src/app-config
      configMaps:
        - name: app-config-rhdh

    dynamicPluginsConfigMapName: dynamic-plugins-rhdh

    extraFiles:
      mountPath: /opt/app-root/catalog

    extraEnvs:
      envs:
        - name: NODE_ENV
          value: production
        - name: NODE_OPTIONS
          value: "--max_old_space_size=2048 --no-node-snapshot"
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
      secrets:
        - name: secrets-rhdh

  deployment:
    patch:
      spec:
        template:
          spec:
            volumes:
              - name: catalog-info
                configMap:
                  name: catalog-info

              - name: rag-data-volume
                emptyDir: {}

            initContainers:
              - name: init-rag-data
                image: registry.redhat.io/rhdh/rhdh-rag-content-rhel9:1.10
                command:
                  - sh
                  - -c
                  - |
                    echo 'Copying RAG data...'
                    cp -r /rag/. /data/
                    chmod -R 777 /data/vector_db
                    echo 'Copy complete.'
                volumeMounts:
                  - name: rag-data-volume
                    mountPath: /data

            containers:
              - name: backstage-backend
                image: image-registry.openshift-image-registry.svc:5000/quarkusdroneshop-rhdh/rhdh-hub-custom:latest
                imagePullPolicy: Always

                resources:
                  requests:
                    cpu: "1"
                    memory: "2Gi"
                    ephemeral-storage: "10Gi"
                  limits:
                    cpu: "4"
                    memory: "8Gi"
                    ephemeral-storage: "30Gi"

                volumeMounts:
                  - name: catalog-info
                    mountPath: /opt/app-root/catalog