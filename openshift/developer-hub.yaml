apiVersion: rhdh.redhat.com/v1alpha2
kind: Backstage
metadata:
  name: developer-hub
  namespace: quarkusdroneshop-rhdh
spec:
  application:
    image: image-registry.openshift-image-registry.svc:5000/quarkusdroneshop-rhdh/rhdh-hub-custom:latest
    replicas: 1

    route:
      enabled: true

    appConfig:
      configMaps:
        - name: app-config
      mountPath: /opt/app-root/src

    extraFiles:
      configMaps:
        - name: catalog-info
          mountPath: /opt/app-root/src/catalog-info.yaml
          files:
            - key: catalog-info.yaml
              path: catalog-info.yaml

    extraEnvs:
      secrets:
        - name: secrets-rhdh

    # ⭐ ここが重要（dynamic plugin 使用）
    dynamicPluginsConfigMapName: dynamic-plugins-rhdh

  database:
    enableLocalDb: true