apiVersion: kafka.strimzi.io/v1
kind: KafkaMirrorMaker2
metadata:
  name: mm2-extended
  namespace: quarkusdroneshop-demo
spec:
  version: 4.1.0
  replicas: 1
  enableRestApi: true
  # NOTE: v1beta2 の clusters[]/connectCluster/sourceCluster/targetCluster は
  # v1 (このクラスタで現在有効なストレージバージョン) では廃止されており、
  # target (Connect自身の内部トピック用クラスタ) と各mirrorのsource が必須。
  # このファイルは元々 v1beta2 スタイルで作成され、CRDがv1に切り替わった後も
  # 実クラスタ側のオブジェクトだけがtarget/sourceを欠いたまま動き続けていたため
  # (削除以外の書き込みが無ければ既存オブジェクトへの検証は走らない)、
  # 次回このマニフェストを適用すると同じ検証エラーで失敗する状態だった。
  # 実クラスタに直接PATCHして復旧させた際の値と一致させてある
  # (target.bootstrapServers/groupId等はPod内の実際のConnect設定ファイルから
  # 確認した値)。
  #
  # NOTE: ファイル名は「a-site → b-site」のミラー方向を表す
  # (target=bsiteのため、実際にはbsiteクラスタに適用するファイル。
  # デプロイ先クラスタ名とファイル名が一致しない点に注意。
  # script/ocpdeploy.sh 側もこの対応関係で参照している)。
  target:
    alias: "shop-bsite"
    bootstrapServers: "shop-cluster-kafka-bootstrap:9092"
    configStorageTopic: "mirrormaker2-cluster-configs"
    offsetStorageTopic: "mirrormaker2-cluster-offsets"
    statusStorageTopic: "mirrormaker2-cluster-status"
    groupId: "mirrormaker2-cluster"
  ports:
    - name: rest-api
      port: 8083
      targetPort: 8083
      protocol: TCP
  selector:
    strimzi.io/name: mm2-extended-mirrormaker2
  logging:
    type: inline
    loggers:
      connect.root.logger.level: "INFO"
      org.apache.kafka.connect.mirror.MirrorSourceConnector: "DEBUG"
      org.apache.kafka.connect.mirror.CheckpointTask: "DEBUG"
      org.apache.kafka.connect.mirror.HeartbeatTask: "DEBUG"
      org.apache.kafka.connect.mirror.MirrorClient: "DEBUG"
      org.apache.kafka.connect.mirror.OffsetSyncStore: "DEBUG"
  mirrors:
    - source:
        alias: "shop-asite"
        bootstrapServers: "external-shop-cluster-kafka-asite:9094"
      topicsPattern: "^(qdca10-in|qdca10pro-in|orders.*|web.*|inventory.*|eighty-six.*|rewards|loyalty-updates.*)$"
      groupsPattern: ".*"
      sourceConnector:
        enabled: true
        config:
          bootstrap.servers: "external-shop-cluster-kafka-asite:9094"
          replication.policy.class: "org.apache.kafka.connect.mirror.DefaultReplicationPolicy"
          replication.policy.separator: "."
          consumer.fetch.min.bytes: "1"
          consumer.fetch.max.wait.ms: "10"
          producer.linger.ms: "0"
          producer.batch.size: "16384"
          emit.heartbeats.enabled: true
          emit.checkpoints.enabled: true
          sync.group.offsets.enabled: true
          sync.topic.acls.enabled: false
          refresh.topics.enabled: true
          refresh.groups.enabled: true
          auto.create.topics.enable: true
          security.protocol: SASL_PLAINTEXT
          sasl.mechanism: SCRAM-SHA-512
          sasl.jaas.config: "${SASL_JAAS_CONFIG}"
          producer.request.timeout.ms: 60000
          consumer.request.timeout.ms: 60000
          consumer.metadata.fetch.timeout.ms: 60000
          offset-syncs.topic.replication.factor: 1
          refresh.topics.interval.seconds: 10
          client.dns.lookup: use_all_dns_ips
          config.storage.topic: mirrormaker2-cluster-configs
          offset.storage.topic: mirrormaker2-cluster-offsets
          status.storage.topic: mirrormaker2-cluster-status
  template:
    connectContainer:
      env:
        - name: KAFKA_CONNECT_REST_ADVERTISED_HOST_NAME
          value: "mm2-extended-mirrormaker2"
        - name: KAFKA_CONNECT_REST_PORT
          value: "8083"
        - name: SASL_JAAS_CONFIG
          valueFrom:
            secretKeyRef:
              name: quarkusdroneshop-user
              key: sasl.jaas.config
