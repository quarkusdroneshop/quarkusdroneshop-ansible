apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: shop-cluster
  namespace: quarkusdroneshop-demo
  annotations:
   strimzi.io/kraft: enabled
spec:
  kafka:
    version: "4.1.0"
    replicas: 3
    controllerReplicas: 3
    config:
      process.roles: "controller,broker"
      controller.listener.names: CONTROLLER
      log.dirs: "/var/lib/kafka/data"
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
      - name: external
        port: 9094
        type: loadbalancer
        tls: false
        configuration:
          bootstrap:
            advertisedHost: af37d1afcb709441e8d66e9671a585d4-114249869.us-east-2.elb.amazonaws.com
            advertisedPort: 9094
          brokers:
            - broker: 0
              advertisedHost: adaf379931cee4f9584397f53c57a0bc-1443954267.us-east-2.elb.amazonaws.com
              advertisedPort: 9094
            - broker: 1
              advertisedHost: ad7948891c8164285ac22a6a773f93dc-1710407454.us-east-2.elb.amazonaws.com
              advertisedPort: 9094
            - broker: 2
              advertisedHost: ab9e907a91e83427e83c1c4f71d58eaf-425956974.us-east-2.elb.amazonaws.com
              advertisedPort: 9094
  entityOperator:
    topicOperator: {}
    userOperator: {}
