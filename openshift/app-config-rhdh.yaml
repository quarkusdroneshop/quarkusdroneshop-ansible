apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-rhdh
  namespace: quarkusdroneshop-rhdh
  annotations:
    rhdh.redhat.com/backstage-name: developer-hub

data:
  app-config-rhdh.yaml: |
    app:
      title: Red Hat Datamesh Hub
      baseUrl: ${BASE_URL}
      branding:
        fullLogoWidth: 200
        fullLogo: 'data:image/png;base64,'

    backend:
      baseUrl: ${BASE_URL}

      csp:
        frame-src:
          - "'self'"
          - ${OM_HTTPS_URL}
          - ${OM_PROXY_URL}

      reading:
        allow:
          - host: github.com
          - host: raw.githubusercontent.com

      cors:
        origin: ${BASE_URL}
        credentials: true

      auth:
        externalAccess:
          - type: legacy
            options:
              secret: "${BACKEND_SECRET}"
              subject: legacy-default-config

      database:
        client: pg
        connection:
          host: backstage-psql-developer-hub
          port: 5432
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
          database: postgres

    techdocs:
      builder: local
      generator:
        runIn: local
        mkdocs:
          defaultPlugins: ['techdocs-core']
      publisher:
        type: local
        
    dynamicPlugins:
      rootDirectory: /opt/app-root/src/dynamic-plugins-root

      frontend:
        defaultEnable:
          techdocs: true
          catalog: true
          scaffolder: true
          kubernetes: true
          argocd: true
        backstage-community.plugin-topology:
          menuItems:
            - name: openmetadata
              title: データカタログ
              icon: docs
              to: '${OPENMETADATA_URL}/my-data'
            - name: data-products
              title: データプロダクト
              icon: docs
              to: '${OPENMETADATA_URL}/dataProduct'
            - name: systems
              title: システム
              icon: docs
              to: '${BASE_URL}/catalog?filters%5Bkind%5D=system&limit=20'
            - name: test-reports
              title: テスト
              icon: docs
              to: '${BASE_URL}/catalog?filters%5Bkind%5D=component&limit=20'
          mountPoints:
            - mountPoint: entity.page.topology/cards
              importName: TopologyPage
              config:
                layout:
                  gridColumn: "1 / -1"
                  height: calc(100vh - 200px)
          entityTabs:
            - path: /topology
              title: Topology
              mountPoint: entity.page.topology
        backstage-community.plugin-tekton:
          entityTabs:
            - path: /ci
              title: CI
              mountPoint: entity.page.ci
        internal.plugin-test-report:
          mountPoints:
            - mountPoint: entity.page.test-report/cards
              importName: TestReportContent
              config:
                layout:
                  gridColumn: "1 / -1"
                if:
                  allOf:
                    - isKind: component
          entityTabs:
            - path: /test-report
              title: Test Report
              mountPoint: entity.page.test-report
              if:
                allOf:
                  - isKind: component
      backend:
        defaultEnable: true
        disabledPlugins:
          - lightspeed
          - adoption-insights
          - licensed-users-info
          - extensions

    auth:
      environment: production
      dangerouslyAllowSignInWithoutUserInCatalog: true

      providers:
        oidc:
          production:
            metadataUrl: ${AUTH_OIDC_METADATA_URL}
            clientId: ${AUTH_OIDC_CLIENT_ID}
            clientSecret: ${AUTH_OIDC_CLIENT_SECRET}
            prompt: auto

            signIn:
              resolvers:
                - resolver: emailMatchingUserEntityProfileEmail
                - resolver: emailLocalPartMatchingUserEntityName

      session:
        secret: ${BACKEND_SECRET}

    signInPage: oidc

    catalog:
      rules:
        - allow:
            - Component
            - System
            - API
            - Resource
            - Location
            - Template
            - User
            - Group

      locations:
        - type: file
          target: /opt/app-root/catalog/catalog-info.yaml

        - type: url
          target: https://github.com/quarkusdroneshop/developerhub-skeleton/blob/main/template.yaml

      ui:
        create:
          enabled: true
      
      providers:
        github:
          quarkusdroneshop:
            organization: quarkusdroneshop
            catalogPath: /catalog-info.yaml
            filters:
              branch: main
              repository: >-
                ^(quarkusdroneshop-web|quarkusdroneshop-counter|quarkusdroneshop-homeoffice|quarkusdroneshop-homeoffice-ui|quarkusdroneshop-inventory|quarkusdroneshop-qdca10|quarkusdroneshop-qdca10pro|quarkusdroneshop-reward)$
            schedule:
              frequency: { minutes: 30 }
              timeout: { minutes: 3 }

    featureFlags:
      scaffolder: true

    enabled:
      kubernetes: true
      argocd: true
      tekton: true

    integrations:
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}
        
    kubernetes:
      clusterLocatorMethods:
        - type: config
          clusters:
            - authProvider: serviceAccount
              name: "${K8S_CLUSTER_NAME}"
              serviceAccountToken: "${K8S_CLUSTER_TOKEN}"
              url: "${K8S_CLUSTER_URL}"
              skipTLSVerify: true
            - authProvider: serviceAccount
              name: "a-cluster"
              serviceAccountToken: "${K8S_CLUSTER_TOKEN_A}"
              url: "${K8S_CLUSTER_URL_A}"
              skipTLSVerify: true
            - authProvider: serviceAccount
              name: "b-cluster"
              serviceAccountToken: "${K8S_CLUSTER_TOKEN_B}"
              url: "${K8S_CLUSTER_URL_B}"
              skipTLSVerify: true
            - authProvider: serviceAccount
              name: "c-cluster"
              serviceAccountToken: "${K8S_CLUSTER_TOKEN_C}"
              url: "${K8S_CLUSTER_URL_C}"
              skipTLSVerify: true

      customResources:
        - group: "tekton.dev"
          apiVersion: "v1beta1"
          plural: "pipelineruns"
        - group: "tekton.dev"
          apiVersion: "v1beta1"
          plural: "taskruns"
        - group: "tekton.dev"
          apiVersion: "v1beta1"
          plural: "pipelines"
        - group: "tekton.dev"
          apiVersion: "v1beta1"
          plural: "tasks"
        - group: "route.openshift.io"
          apiVersion: "v1"
          plural: "routes"
        - group: "apps.openshift.io"
          apiVersion: "v1"
          plural: "deploymentconfigs"

      serviceLocatorMethod:
        type: singleTenant

    tekton:
      defaultNamespace: "quarkusdroneshop-cicd"

    argocd:
      appLocatorMethods:
        - type: config
          instances:
            - name: main
              url: "${ARGOCD_INSTANCE_URL}"
              username: "${ARGOCD_USERNAME}"
              password: "${ARGOCD_PASSWORD}"

    proxy:
      '/argocd/api':
        target: "${ARGOCD_INSTANCE_URL}/api/v1/"
        changeOrigin: true
        secure: false
        headers:
          Cookie:
            $env: "${ARGOCD_AUTH_TOKEN}"

      '/kubernetes-api':
        target: "${K8S_CLUSTER_URL}"
        changeOrigin: true
        secure: false
        headers:
          Authorization: 'Bearer ${K8S_CLUSTER_TOKEN}'

      '/target-cluster':
        target: "${TARGET_K8S_CLUSTER_URL}"
        changeOrigin: true
        secure: false
        headers:
          Authorization: 'Bearer ${TARGET_K8S_CLUSTER_TOKEN}'

    permission:
      rbac:
        admin:
          users:
            - name: user:default:nmushino

        pluginsWithPermission:
          - catalog
          - scaffolder
          - permission
          - auth
          - techdocs
          - kubernetes
          - catalog-import
          - search
          - cost-insights
          - api-docs
          - lighthouse
          - catalog-graph
          - tekton

    licensedUsersInfo:
      enabled: false