apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeoffice-backend
  namespace: quarkusdroneshop-demo
  labels:
    app: homeoffice-backend
    environment: production
    category: droneshop
spec:
  template:
    spec:
      containers:
      - name: homeoffice-backend
        env:
           - name: POSTGRESQL_JDBC_URL
             valueFrom:
               configMapKeyRef:
                 name: droneshop-config
                 key: PGSQL_URL
           - name: POSTGRESQL_USER
             valueFrom:
               secretKeyRef:
                 name: droneshopdb-pguser-droneshopadmin
                 key: user
           - name: POSTGRESQL_PASSWORD
             valueFrom:
               secretKeyRef:
                 name: droneshopdb-pguser-droneshopadmin
                 key: password
           # Retry ボタンから dataproduct-order-events (asite, ORDER_PLACED イベントとして
           # 再送) へ直接 publish するための asite Kafka 外部リスナー (PLAINTEXT)。
           # 【2026-08-04】以前は ELB ホスト名を直書きしていたが Sandbox 再構築のたびに
           # 変わり壊れるため、Skupper が csite/asite/bsite 間に常設している安定した
           # Service 名 (external-shop-cluster-kafka-<site>) を使う。Producer の疎通
           # のみが必要な用途 (単発 publish) では動作確認済み。
           - name: ASITE_KAFKA_EXTERNAL_BOOTSTRAP_URLS
             value: "external-shop-cluster-kafka-asite:9094"