apiVersion: v1
kind: ConfigMap
metadata:
  name: om-proxy-config
  namespace: openmetadata
data:
  nginx.conf: |
    worker_processes 1;
    error_log /tmp/nginx-error.log warn;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;
      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }
      server {
        listen 8080;
        location / {
          proxy_pass         http://openmetadata.openmetadata.svc.cluster.local:8585;
          proxy_http_version 1.1;
          proxy_set_header   Host $host;
          proxy_set_header   X-Real-IP $remote_addr;
          proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header   Accept-Encoding "";
          proxy_set_header   Upgrade $http_upgrade;
          proxy_set_header   Connection $connection_upgrade;
          proxy_buffering    off;
          sub_filter_once    on;
          sub_filter_types   text/html;
          sub_filter '</head>' '<style>
            .ant-layout-header,
            [data-testid="om-topbar"],
            [data-testid="navbar"],
            [data-testid="appbar"],
            header { display: none !important; height: 0 !important; overflow: hidden !important; }
            .ant-layout-sider,
            [data-testid="left-sidebar"],
            [data-testid="sidebar"],
            aside { display: none !important; width: 0 !important; overflow: hidden !important; }
            .ant-layout { min-height: 100vh; }
            .ant-layout-content { margin: 0 !important; padding: 8px !important; }
          </style>
          <script>
          (function(){
            var HIDDEN_ELS = [];
            var SELECTORS = [
              "header",
              "aside",
              ".ant-layout-header",
              ".ant-layout-sider",
              "[data-testid=om-topbar]",
              "[data-testid=navbar]",
              "[data-testid=appbar]",
              "[data-testid=left-sidebar]",
              "[data-testid=sidebar]",
              "[class*=Navbar]",
              "[class*=TopBar]",
              "[class*=Topbar]",
              "[class*=SideBar]",
              "[class*=LeftSidebar]",
              "[class*=left-sidebar]",
              "[class*=om-navbar]",
              "[id*=navbar]",
              "[id*=sidebar]"
            ];
            function hideAll() {
              SELECTORS.forEach(function(sel) {
                try {
                  document.querySelectorAll(sel).forEach(function(el) {
                    el.style.setProperty("display","none","important");
                    el.style.setProperty("width","0","important");
                    el.style.setProperty("height","0","important");
                    el.style.setProperty("overflow","hidden","important");
                  });
                } catch(e){}
              });
            }
            var obs = new MutationObserver(function(mutations) {
              var needsHide = false;
              mutations.forEach(function(m) {
                if (m.addedNodes.length > 0) needsHide = true;
              });
              if (needsHide) hideAll();
            });
            function start() {
              if (document.body) {
                hideAll();
                obs.observe(document.body, {childList:true, subtree:true});
              }
            }
            if (document.readyState === "loading") {
              document.addEventListener("DOMContentLoaded", start);
            } else {
              start();
            }
            [300, 800, 1500, 3000, 5000].forEach(function(t){ setTimeout(hideAll, t); });
            window.addEventListener("popstate", function(){ setTimeout(hideAll, 100); });
            var origPush = history.pushState;
            history.pushState = function() { origPush.apply(this, arguments); setTimeout(hideAll, 100); };
          })();
          </script></head>';
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: om-proxy
  namespace: openmetadata
  labels:
    app: om-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: om-proxy
  template:
    metadata:
      labels:
        app: om-proxy
    spec:
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: nginx-config
          configMap:
            name: om-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: om-proxy
  namespace: openmetadata
spec:
  selector:
    app: om-proxy
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: om-proxy
  namespace: openmetadata
spec:
  host: om-proxy-openmetadata.{{ ocp_apps_domain }}
  to:
    kind: Service
    name: om-proxy
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
