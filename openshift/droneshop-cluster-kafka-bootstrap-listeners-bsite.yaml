apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: shop-cluster
  namespace: quarkusdroneshop-demo
  annotations:
   strimzi.io/kraft: enabled
spec:
  kafka:
    version: "4.1.0"
    replicas: 3
    controllerReplicas: 3
    config:
      process.roles: "controller,broker"
      controller.listener.names: CONTROLLER
      log.dirs: "/var/lib/kafka/data"
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
      - name: external
        port: 9094
        type: loadbalancer
        tls: false
        configuration:
          bootstrap:
            advertisedHost: a0ed8f356f2224290bfc43ad699a8cf1-1104838607.us-east-2.elb.amazonaws.com
            advertisedPort: 9094
          brokers:
            - broker: 0
              advertisedHost: a0ed8f356f2224290bfc43ad699a8cf1-1104838607.us-east-2.elb.amazonaws.com
              advertisedPort: 9094
            - broker: 1
              advertisedHost: a0ed8f356f2224290bfc43ad699a8cf1-1104838607.us-east-2.elb.amazonaws.com
              advertisedPort: 9094
            - broker: 2
              advertisedHost: a0ed8f356f2224290bfc43ad699a8cf1-1104838607.us-east-2.elb.amazonaws.com
              advertisedPort: 9094
  entityOperator:
    topicOperator: {}
    userOperator: {}
