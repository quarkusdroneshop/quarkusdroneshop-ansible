    apiVersion: backstage.io/v1alpha1
    kind: API
    metadata:
      name: kafka-asite-qdca10-in
      description: "Kafka トピック: qdca10-in（QDCA10への注文指示）"
      annotations:
        backstage.io/kubernetes-cluster: a-cluster
        openmetadata/explore-url: "http://openmetadata-openmetadata.apps.ocp.mnlq9.sandbox1332.opentlc.com/topic/external-shop-cluster-kafka-asite%3A9094.qdca10-in/schema"
      links:
        - url: "http://openmetadata-openmetadata.apps.ocp.mnlq9.sandbox1332.opentlc.com/topic/external-shop-cluster-kafka-asite%3A9094.qdca10-in/schema"
          title: データカタログ
          icon: dashboard
    spec:
      type: asyncapi
      lifecycle: production
      owner: user:default/nmushino
      system: a-cluster
      definition: |
        asyncapi: 2.6.0
        info:
          title: qdca10-in
          version: 1.0.0
          description: カウンターからQDCA10への注文チケット送信トピック
        servers:
          production:
            url: shop-cluster-kafka-bootstrap:9092
            protocol: kafka
        channels:
          qdca10-in:
            description: QDCA10への注文チケットを送信するトピック
            publish:
              operationId: sendQdca10Order
              message:
                name: OrderTicket
                contentType: application/json
                payload:
                  type: object
                  properties:
                    orderId:
                      type: string
                    item:
                      type: string
                    preparedBy:
                      type: string
    ---
