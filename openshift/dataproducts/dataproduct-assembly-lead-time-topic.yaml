# shop-cluster は auto.create.topics.enable: false のため、
# qdca10-lead-time-job.sql / qdca10pro-lead-time-job.sql の sink はジョブ投入前に
# 明示的に作成しておく必要がある。
# トピック名は dataproduct.* 命名 (MirrorMaker2 のクロスサイト購読対象パターンに
# 合致させるため) に統一している。metadata.name はハイフン区切りで実トピック名と一致。
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: dataproduct-assembly-lead-time-qdca10
  namespace: quarkusdroneshop-demo
  labels:
    strimzi.io/cluster: shop-cluster
spec:
  topicName: dataproduct-assembly-lead-time-qdca10
  partitions: 10
  replicas: 3
  config:
    retention.ms: 604800000
    segment.bytes: 1073741824
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: dataproduct-assembly-lead-time-qdca10pro
  namespace: quarkusdroneshop-demo
  labels:
    strimzi.io/cluster: shop-cluster
spec:
  topicName: dataproduct-assembly-lead-time-qdca10pro
  partitions: 10
  replicas: 3
  config:
    retention.ms: 604800000
    segment.bytes: 1073741824
