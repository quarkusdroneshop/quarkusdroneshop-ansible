# shop-cluster は auto.create.topics.enable: false のため、
# dataproduct-inventory-event/flink/component-stock-job.sql の sink (dataproduct.* 命名の
# もの) はジョブ投入前に明示的に作成しておく必要がある。
# (このデータプロダクトのディレクトリは旧名 drone-component-stock)
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: dataproduct-component-stock-quantity
  namespace: quarkusdroneshop-demo
  labels:
    strimzi.io/cluster: shop-cluster
spec:
  partitions: 10
  replicas: 3
  config:
    retention.ms: -1
    cleanup.policy: compact
    segment.bytes: 1073741824
---
# component_stock_events からリネーム (2026-07-21)。RestockRequestedEvent/
# RestockCompletedEvent の履歴を append する用途のため、compact ではなく
# 時間ベースの retention。
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: dataproduct-inventory-events
  namespace: quarkusdroneshop-demo
  labels:
    strimzi.io/cluster: shop-cluster
spec:
  partitions: 10
  replicas: 3
  config:
    retention.ms: 604800000
    segment.bytes: 1073741824
---
# QDCA10/QDCA10pro が注文消費後の絶対在庫数 (item 単位) を publish するトピック。
# component-stock-job.sql がこれをそのまま component_stock_quantity へ upsert する。
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: dataproduct-component-stock-decrement
  namespace: quarkusdroneshop-demo
  labels:
    strimzi.io/cluster: shop-cluster
spec:
  partitions: 10
  replicas: 3
  config:
    retention.ms: 604800000
    segment.bytes: 1073741824
