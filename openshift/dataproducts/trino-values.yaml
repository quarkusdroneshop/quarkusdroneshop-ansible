# Trino には OperatorHub 上の公式 Operator が存在しないため、
# 公式 Helm チャート (https://trinodb.github.io/charts) で deploy する。
# インストール手順自体は ocpdeploy.sh `dataproducts setup` にまとめるが、
# Operator ではない点を明示しておく。
#
# helm repo add trino https://trinodb.github.io/charts
# helm upgrade --install trino trino/trino -n quarkusdroneshop-demo -f trino-values.yaml

image:
  tag: "460"

server:
  workers: 2
  config:
    # 認証: Keycloak (RHBK) に対する OIDC。実際の issuer/client-id/secret は
    # Keycloak にサービスアカウントクライアント (trino-coordinator) を作成した後、
    # Secret (trino-oidc) として注入する。値は都度決定する。
    authenticationType: "OAUTH2"
  # http-server.authentication.type はコーディネーターの config.properties にしか
  # 描画されないため (worker は外部向け HTTP API を持たない)、oauth2.* を
  # 全ノード共通の additionalConfigProperties に入れると worker 側で
  # "was not used" エラーになる。coordinatorExtraConfig でコーディネーター限定にする。
  coordinatorExtraConfig: |
    http-server.authentication.oauth2.issuer=${ENV:KEYCLOAK_ISSUER_URL}
    http-server.authentication.oauth2.client-id=${ENV:TRINO_OIDC_CLIENT_ID}
    http-server.authentication.oauth2.client-secret=${ENV:TRINO_OIDC_CLIENT_SECRET}

# additionalConfigProperties はチャートのトップレベルキー
# (server: 配下ではない。誤ってネストすると config.properties に反映されない)。
# coordinator/worker 共通で必要なものだけをここに置く。
additionalConfigProperties:
  # OAuth2 有効化時は coordinator/worker 間の内部通信にも共有シークレットが必要
  - internal-communication.shared-secret=${ENV:INTERNAL_SHARED_SECRET}

envFrom:
  - secretRef:
      name: trino-oidc

env:
  # MinIO (S3互換, Iceberg の実データファイル格納先) の認証情報。
  # dataproducts_setup が作成する dataproducts-minio-auth を使う
  # (キー名が rootUser/rootPassword のため、Iceberg catalog 設定で参照する
  # 名前 (MINIO_ROOT_USER/MINIO_ROOT_PASSWORD) に合わせて明示的にリネームする)。
  - name: MINIO_ROOT_USER
    valueFrom:
      secretKeyRef:
        name: dataproducts-minio-auth
        key: rootUser
  - name: MINIO_ROOT_PASSWORD
    valueFrom:
      secretKeyRef:
        name: dataproducts-minio-auth
        key: rootPassword

catalogs:
  iceberg: |
    connector.name=iceberg
    # Iceberg REST/Hive カタログの URL・認証情報は環境ごとに決定し Secret で注入する。
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=${ENV:ICEBERG_REST_CATALOG_URL}
    # Lakekeeper 側で登録したウェアハウス名 (dataproducts_lakekeeper_setup で
    # "dataproducts" 固定で作成している)。未指定だと Trino から
    # "No warehouse specified" で全クエリが失敗する。
    iceberg.rest-catalog.warehouse=dataproducts
    # カタログ (メタデータ) の URL/認証だけでなく、実データファイル (Parquet) を
    # 読み書きする S3 (MinIO) 側のファイルシステム設定も別途必要
    # ("No factory for location: s3://..." で失敗する場合はこれが未設定)。
    fs.native-s3.enabled=true
    s3.endpoint=http://dataproducts-minio:9000
    s3.region=us-east-1
    s3.path-style-access=true
    s3.aws-access-key=${ENV:MINIO_ROOT_USER}
    s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}

  # 各データプロダクトの trino/*.sql は "dataproducts.<schema>.<view>" という
  # 命名で公開ビューを作成する ("ドメイン内部の Iceberg テーブルは直接公開せず、
  # dataproducts.* スキーマの公開ビュー経由のみアクセスさせる" という README の
  # 方針)。実体は iceberg カタログと同じ REST Catalog (Lakekeeper) だが、
  # 内部の生テーブル (iceberg.dataproducts.*) と公開ビュー (dataproducts.*) を
  # カタログレベルで分離するため、同じバックエンドに対する別カタログとして
  # 定義する。
  dataproducts: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=${ENV:ICEBERG_REST_CATALOG_URL}
    iceberg.rest-catalog.warehouse=dataproducts
    fs.native-s3.enabled=true
    s3.endpoint=http://dataproducts-minio:9000
    s3.region=us-east-1
    s3.path-style-access=true
    s3.aws-access-key=${ENV:MINIO_ROOT_USER}
    s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}

# File-based System Access Control (trino-access-control-rules.json) は
# Trino 460 の columns.mask 形式と非互換 (UncheckedIOException: Failed to
# convert JSON tree node) で coordinator が起動しなかったため、いったん無効化。
# customer-360 データプロダクトのマスキングルールを有効化する際に、
# 現行の Trino バージョンに合わせて trino-access-control-rules.json を
# 修正した上で再度有効化すること。
# accessControl:
#   type: configmap
#   configFile: "rules.json"
#   rules:
#     rules.json: |-
#       (openshift/dataproducts/trino-access-control-rules.json の内容)
