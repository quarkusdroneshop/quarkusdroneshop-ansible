# shop-cluster は auto.create.topics.enable: false のため、
# dataproduct-customer-360/flink/customer-360-job.sql の sink はジョブ投入前に
# 明示的に作成しておく必要がある。upsert-kafka (customerName ごとの現在状態) の
# ため compact retention にする。
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: dataproduct-customer-360
  namespace: quarkusdroneshop-demo
  labels:
    strimzi.io/cluster: shop-cluster
spec:
  partitions: 10
  replicas: 3
  config:
    retention.ms: -1
    cleanup.policy: compact
    segment.bytes: 1073741824
