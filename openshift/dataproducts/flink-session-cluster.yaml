# Flink Kubernetes Operator (openshift/flink-operator.yaml) が管理する
# Session Cluster。dataproducts/*/flink/*.sql はこのクラスタに対して
# ./script/ocpdeploy.sh dataproducts deploy から SQL Client 経由で投入する。
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: dataproducts-flink
  namespace: quarkusdroneshop-demo
spec:
  image: apache/flink:1.19-java17
  flinkVersion: v1_19
  mode: standalone
  flinkConfiguration:
    # order-events だけで 3 本の常駐ストリーミングジョブ (ORDER_PLACED /
    # LINE_ITEM_STATUS_CHANGED / ORDER_CANCELLED) が同時稼働し、後続の
    # データプロダクトも追加されるため、TaskManager 1 台・2 スロットでは
    # 不足する ("Could not acquire the minimum required resources")。
    # dataproduct-inventory-analytics が Kafka + Iceberg 両方へ書き込むようになり
    # (turnover x2 + stockout_risk x1) x2 (Kafka/Iceberg) = 6 タスクへ増えたため、
    # 全データプロダクト合計のタスク数が 8 スロットを超過するようになった
    # ("Could not acquire the minimum required resources")。16 に増やす。
    taskmanager.numberOfTaskSlots: "16"
    # スキーマ登録は Apicurio (schema/*.avsc)、認証は Keycloak (OIDC) を経由する。
    # 具体的な REST URL / realm / client-id は環境ごとに Secret で注入する
    # (values は `oc create secret generic dataproducts-flink-auth` で都度決定)。
    security.kerberos.login.use-ticket-cache: "false"
    # rest.address 未設定だと JobManager が内部的な REST 自己呼び出し
    # (ジョブ投入時など) を rest.bind-address のデフォルトである
    # 0.0.0.0:8081 に対して行おうとして "Connection refused: /0.0.0.0:8081"
    # で失敗する。明示的に到達可能なアドレスを指定する。
    rest.address: dataproducts-flink-rest.quarkusdroneshop-demo.svc
    rest.bind-address: 0.0.0.0
    # クラスタ (OpenShift) 再起動で JobManager Pod が入れ替わると、それまで
    # 投入していたジョブグラフはメモリ上にしか無かったため全て消え、
    # `./script/ocpdeploy.sh dataproducts deploy` による手動再投入が
    # 毎回必要だった。Kubernetes HA を有効にし、ジョブグラフ/チェックポイントを
    # 各サイトの MinIO (S3 互換, dataproducts_setup で構築済み) に永続化することで、
    # JobManager 再起動時に Operator が自動でジョブを検出・再起動できるようにする。
    high-availability.type: kubernetes
    high-availability.storageDir: s3://dataproducts/flink-ha
    execution.checkpointing.interval: "60000"
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    state.checkpoints.dir: s3://dataproducts/flink-checkpoints
    state.savepoints.dir: s3://dataproducts/flink-savepoints
    s3.endpoint: http://dataproducts-minio:9000
    s3.path.style.access: "true"
    # デフォルトの再起動戦略 (restart-strategy 未設定時) は
    # NoRestartBackoffTimeStrategy であり、HA復旧時に TaskManager 未登録などの
    # 一時的な失敗が1回でも起きるとリトライされず、ジョブグラフごと
    # JobResultStore から削除されて永久に失われる (JobManager 再起動のたびに
    # 一部のジョブだけ復旧できない不具合の原因)。数回はリトライするよう設定する。
    restart-strategy.type: fixed-delay
    restart-strategy.fixed-delay.attempts: "10"
    restart-strategy.fixed-delay.delay: "10 s"
  serviceAccount: flink
  jobManager:
    resource:
      memory: "1024m"
      cpu: 1
  taskManager:
    resource:
      memory: "1024m"
      cpu: 1
  podTemplate:
    spec:
      # ベースの apache/flink イメージには Kafka connector / Avro-Confluent format
      # の jar が含まれていないため、initContainer でダウンロードして
      # /opt/flink/lib に追加する (base image の lib をコピーした上で追加する)。
      initContainers:
        - name: add-connectors
          image: apache/flink:1.19-java17
          command:
            - /bin/sh
            - -c
            - |
              set -e
              cp /opt/flink/lib/*.jar /flink-libs/
              curl -fL -o /flink-libs/flink-sql-connector-kafka.jar \
                https://repo.maven.apache.org/maven2/org/apache/flink/flink-sql-connector-kafka/3.2.0-1.19/flink-sql-connector-kafka-3.2.0-1.19.jar
              curl -fL -o /flink-libs/flink-sql-avro-confluent-registry.jar \
                https://repo.maven.apache.org/maven2/org/apache/flink/flink-sql-avro-confluent-registry/1.19.1/flink-sql-avro-confluent-registry-1.19.1.jar
              # Iceberg REST Catalog (Lakekeeper) へ書き込むデータプロダクト用
              # (例: dataproduct-inventory-analytics)。iceberg-flink-runtime が
              # Flink Table API 統合 + REST カタログクライアントを含み、
              # iceberg-aws-bundle が MinIO (S3 互換) への実データ書き込み
              # (S3FileIO, AWS SDK v2 ベース) を含む。
              curl -fL -o /flink-libs/iceberg-flink-runtime.jar \
                https://repo1.maven.org/maven2/org/apache/iceberg/iceberg-flink-runtime-1.19/1.10.2/iceberg-flink-runtime-1.19-1.10.2.jar
              curl -fL -o /flink-libs/iceberg-aws-bundle.jar \
                https://repo1.maven.org/maven2/org/apache/iceberg/iceberg-aws-bundle/1.10.2/iceberg-aws-bundle-1.10.2.jar
              # iceberg-flink-runtime は (REST カタログ・S3のみで HDFS を一切使わなくても)
              # 内部で org.apache.hadoop.conf.Configuration を参照するため、
              # 実データ本体は不要でも最小限の Hadoop client jar が必要
              # (無いと ClassNotFoundException で CREATE CATALOG が失敗する)。
              curl -fL -o /flink-libs/hadoop-client-api.jar \
                https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-client-api/3.3.6/hadoop-client-api-3.3.6.jar
              curl -fL -o /flink-libs/hadoop-client-runtime.jar \
                https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-client-runtime/3.3.6/hadoop-client-runtime-3.3.6.jar
              # HA (high-availability.storageDir) / チェックポイント
              # (state.checkpoints.dir) の s3:// URI を Flink 自身の
              # FileSystem 抽象化で扱うための plugin。iceberg-aws-bundle は
              # Iceberg 専用の S3FileIO であり、Flink 本体の s3:// FS には
              # 使えないため別途必要。Flink の plugin 機構は /opt/flink/plugins/
              # 配下をサブディレクトリ単位でクラスローダ分離するため、lib ではなく
              # plugins 側に配置する。
              cp -r /opt/flink/plugins/. /flink-plugins/
              mkdir -p /flink-plugins/s3-fs-hadoop
              curl -fL -o /flink-plugins/s3-fs-hadoop/flink-s3-fs-hadoop.jar \
                https://repo.maven.apache.org/maven2/org/apache/flink/flink-s3-fs-hadoop/1.19.1/flink-s3-fs-hadoop-1.19.1.jar
          volumeMounts:
            - name: flink-libs
              mountPath: /flink-libs
            - name: flink-plugins
              mountPath: /flink-plugins
      containers:
        - name: flink-main-container
          envFrom:
            - secretRef:
                # KAFKA_BOOTSTRAP_URLS / APICURIO_REGISTRY_URL / OIDC 関連の
                # client-id・client-secret を保持する。値は Keycloak に
                # サービスアカウントクライアント (dataproducts-flink) を
                # 作成した上で `oc create secret` により注入する。
                name: dataproducts-flink-auth
                optional: true
          env:
            # iceberg-aws-bundle の S3FileIO (AWS SDK v2 標準クレデンシャルチェーン)
            # が MinIO への書き込みに使う。dataproducts_setup が作成する
            # dataproducts-minio-auth (rootUser/rootPassword) をそのまま使う。
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: dataproducts-minio-auth
                  key: rootUser
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: dataproducts-minio-auth
                  key: rootPassword
                  optional: true
            - name: AWS_REGION
              value: us-east-1
          volumeMounts:
            - name: flink-libs
              mountPath: /opt/flink/lib
            - name: flink-plugins
              mountPath: /opt/flink/plugins
      volumes:
        - name: flink-libs
          emptyDir: {}
        - name: flink-plugins
          emptyDir: {}
