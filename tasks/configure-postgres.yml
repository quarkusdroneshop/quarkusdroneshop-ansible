---
- name: check if  project {{ project_namespace }} exists
  shell: "{{ oc_location }} get project {{ project_namespace }}"
  register: user_project
  ignore_errors: true
  changed_when: false
  tags:
    - postgres
    - helm

- name: create projects 
  command: "{{ oc_location }} adm new-project {{ project_namespace }}"
  when: user_project is failed
  ignore_errors: true 
  tags:
    - postgres
    - helm

- name: Create Opeator group
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'operator-group.yaml.j2') }}"
  when: not delete_deployment | bool
  tags: 
    - postgres
    - helm

- name:  Check if postgres-operator is running 
  shell: "{{ oc_location }} get pods  -n {{ project_namespace }} | grep Running | grep -E -o 'pgo-[0-9a-z][0-9a-z].*-[0-9a-z]{5}'"
  register: get_operator
  ignore_errors: yes
  args:
    executable: /bin/bash
  tags: 
    - postgres
    - helm

- fail: msg="Bailing out. this play requires 'postgres-operator to be running'"
  when:  "get_operator.rc == 1 and not delete_deployment|bool"
  tags: 
    - postgres
    - helm

- name: Saving postgres-operator Pod name
  set_fact:
    postgres_utils_pod: "{{ get_operator.stdout }}"
  when: not delete_deployment|bool
  tags: 
    - postgres
    - helm

- name: Copying over Postgres utils file
  template:
    src: templates/postgres-utils.yaml.j2
    dest:  "{{ config_location }}/postgres-utils.yaml"
    owner: "{{ default_owner }}"
    group: "{{ default_group }}"
    mode: 0666
  vars:
    target_project: "{{ project_namespace }}"
  when: not delete_deployment|bool
  tags: 
    - postgres
    - helm

- name: Deploy Postgres utils
  command: "{{ oc_location }}  apply -f {{ config_location }}/postgres-utils.yaml -n {{ project_namespace }}"
  ignore_errors: yes
  when: not delete_deployment|bool
  tags: 
    - postgres
    - helm

- name: Waiting for postgres-utilites to deploy
  shell: |
    set -o pipefail && {{ oc_location }} get pod  -n {{ project_namespace }} | grep -E 'postgres-utilites-[0-9a-z][0-9a-z].*-[0-9a-z]{5}' | grep Running  | wc -l
  register: postgres_build_complete
  when: not delete_deployment|bool
  until: "'1' in postgres_build_complete.stdout"
  retries: 100
  delay: 25
  args:
    executable: /bin/bash
  tags: 
    - postgres
    - helm

- name:  Get postgres-utilites Pod name
  shell: "{{ oc_location }} get pods  -n {{ project_namespace }} | grep Running | grep -E -o 'postgres-utilites-[0-9a-z][0-9a-z].*-[0-9a-z]{5}'"
  register: get_podname
  when: not delete_deployment|bool
  args:
    executable: /bin/bash
  tags: 
    - postgres
    - helm

- name: Saving Postgres-utilites Pod name
  set_fact:
    postgres_utils_pod: "{{ get_podname.stdout }}"
  when: not delete_deployment|bool
  tags: 
    - postgres
    - helm

- name: Get droneshopadmin password (robust)
  command: >
    {{ oc_location }} get secret droneshopdb-pguser-droneshopadmin
    -n {{ project_namespace }}
    -o json
  register: pg_secret_json
  failed_when: false
  changed_when: false
  tags: 
    - postgres
    - helm

- name: Extract password safely
  set_fact:
    pg_password_raw: >-
      {{
        (pg_secret_json.stdout | from_json).data.password | b64decode
      }}
  when:
    - pg_secret_json.rc == 0
    - pg_secret_json.stdout is defined
    - pg_secret_json.stdout | length > 0
  tags: 
    - postgres
    - helm

- name: Init Postgres DB
  command: >
    {{ oc_location }} exec {{ postgres_utils_pod }}
    -n {{ project_namespace }}
    -- env PGPASSWORD={{ pg_password_raw }}
    /bin/init_postgres_db.sh
  when: pg_password_raw | default('') | length > 0
  tags: 
    - postgres
    - helm

- name: Get postgres password (robust)
  command: >
    {{ oc_location }} get secret droneshopdb-pguser-postgres
    -n {{ project_namespace }}
    -o json
  register: pg_secret_json
  failed_when: false
  changed_when: false
  tags: 
    - postgres
    - helm

- name: Extract password safely
  set_fact:
    pg_password_raw: >-
      {{
        (pg_secret_json.stdout | from_json).data.password | b64decode
      }}
  when:
    - pg_secret_json.rc == 0
    - pg_secret_json.stdout is defined
    - pg_secret_json.stdout | length > 0
  tags: 
    - postgres
    - helm

- name: Init Custom DB
  command: >
    {{ oc_location }} exec {{ postgres_utils_pod }}
    -n {{ project_namespace }}
    -- env PGPASSWORD={{ pg_password_raw }}
    /bin/init_postgres_custom.sh
  when: pg_password_raw | default('') | length > 0
  tags: 
    - postgres
    - helm

- name: Deploy pgadmin
  command: "{{ oc_location }}  create -f {{ config_location }}/pgadmin.yaml"
  ignore_errors: yes
  when: not delete_deployment|bool

# pgAdminのPVC(pgadmin4.db)は、OpenShiftが制約付きSCCで
# Pod再起動のたびに割り当てるUIDが変わるため、以前の起動時のUIDで
# 所有されたままだと os.chmod() が権限エラーになり
# CrashLoopBackOff する (グループ権限があっても chmod は所有者のみ可能なため)。
# 事前にファイルを削除しておき、今回のPodのUIDで作り直させることで回避する。
- name: Wait for pgadmin PVC to be created
  shell: |
    set -o pipefail && {{ oc_location }} get pvc -n {{ project_namespace }} \
      -l postgres-operator.crunchydata.com/role=pgadmin \
      -o jsonpath='{.items[0].metadata.name}'
  register: pgadmin_pvc_name
  when: not delete_deployment|bool
  until: pgadmin_pvc_name.stdout | length > 0
  retries: 30
  delay: 10
  args:
    executable: /bin/bash

- name: Reset pgadmin4.db ownership via temporary debug pod
  when: not delete_deployment|bool and pgadmin_pvc_name.stdout | length > 0
  block:
    - name: Create pgadmin PVC debug pod
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: pgadmin-pvc-permfix
            namespace: "{{ project_namespace }}"
          spec:
            restartPolicy: Never
            containers:
              - name: debug
                image: registry.access.redhat.com/ubi9/ubi-minimal:latest
                command: ["sleep", "300"]
                volumeMounts:
                  - name: data
                    mountPath: /var/lib/pgadmin
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: "{{ pgadmin_pvc_name.stdout }}"

    - name: Wait for debug pod to be running
      shell: |
        set -o pipefail && {{ oc_location }} get pod pgadmin-pvc-permfix -n {{ project_namespace }} \
          -o jsonpath='{.status.phase}'
      register: pgadmin_debug_pod_phase
      until: pgadmin_debug_pod_phase.stdout == "Running"
      retries: 30
      delay: 5
      args:
        executable: /bin/bash

    - name: Remove pgadmin4.db so it is recreated with the current pod's UID
      command: "{{ oc_location }} exec pgadmin-pvc-permfix -n {{ project_namespace }} -- rm -f /var/lib/pgadmin/pgadmin4.db"
      ignore_errors: yes

    - name: Delete pgadmin PVC debug pod
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Pod
        name: pgadmin-pvc-permfix
        namespace: "{{ project_namespace }}"

- name: Waiting for pgadmin to deploy
  shell: |
    set -o pipefail && {{ oc_location }} get pod  | grep -E 'crunchy-pgadmin4-[0-9a-z][0-9a-z].*-[0-9a-z]{5}' | grep Running  | wc -l
  register: pgadmin_build_complete
  when: not delete_deployment|bool
  until: "'1' in pgadmin_build_complete.stdout"
  retries: 100
  delay: 25
  args:
    executable: /bin/bash

- name: Delete Postgres utils
  command: "{{ oc_location }}  delete -f {{ config_location }}/postgres-utils.yaml"
  ignore_errors: yes
  when: delete_deployment|bool
  tags: 
    - postgres
    - helm

- name: Delete pgadmin
  command: "{{ oc_location }}  delete -f {{ config_location }}pgadmin.yaml"
  ignore_errors: yes
  when: delete_deployment|bool
  