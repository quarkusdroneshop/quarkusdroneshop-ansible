- name: Create Crunchy Postgres for Kubernetes subscription
  kubernetes.core.k8s:
    state: present
    namespace: "{{ project_namespace }}"
    definition: "{{ lookup('template', 'crunchy-postgres-sub.yaml.j2') }}"
  when: not delete_deployment|bool
  tags:
    - postgres
    - acm-workload
    - helm

# Wait CSV
- name: Wait for Crunchy Postgres CSV to succeed
  shell: |
    oc get csv {{ crunchystartingCSV }} \
      -n {{ project_namespace }} \
      -o jsonpath='{.status.phase}'
  register: csv_status
  retries: 30
  delay: 20
  until: csv_status.stdout == "Succeeded"
  changed_when: false
  when: not delete_deployment|bool
  tags:
    - postgres
    - acm-workload
    - helm

# Wait CRD registration
- name: Wait for PostgresCluster CRD to exist
  shell: |
    oc get crd postgresclusters.postgres-operator.crunchydata.com
  register: crunchy_crd
  retries: 30
  delay: 10
  until: crunchy_crd.rc == 0
  changed_when: false
  when: not delete_deployment|bool
  tags:
    - postgres
    - acm-workload
    - helm

# wait API registration
- name: Wait for PostgresCluster API to be available
  shell: |
    oc api-resources | grep postgresclusters
  register: crunchy_api
  retries: 30
  delay: 10
  until: crunchy_api.rc == 0
  changed_when: false
  when: not delete_deployment|bool
  tags:
    - postgres
    - acm-workload
    - helm

- name: Create Crunchy Postgres database instance
  kubernetes.core.k8s:
    state: present
    namespace: "{{ project_namespace }}"
    apply: true
    definition: "{{ lookup('template', 'crunchy-postgres.yml.j2') }}"
  when: not delete_deployment|bool
  tags:
    - postgres
    - acm-workload
    - helm

- name: Get a list of all PostgresCluster resources
  kubernetes.core.k8s_info:
    api_version: postgres-operator.crunchydata.com/v1beta1
    kind: PostgresCluster
    namespace: "{{ project_namespace }}"
  register: pod_list
  when: not delete_deployment|bool
  tags:
    - postgres
    - acm-workload
    - helm

- name: Print return information from the previous task
  ansible.builtin.debug:
    var: pod_list.resources[0].status.conditions[1].status
    verbosity: 2
  when: not delete_deployment|bool
  tags:
    - postgres
    - acm-workload
    - helm

# wait for Postgres to be ready
- name: Wait for droneshopdb to be ready
  kubernetes.core.k8s_info:
    api_version: postgres-operator.crunchydata.com/v1beta1
    kind: PostgresCluster
    namespace: "{{ project_namespace }}"
  register: r_pgo_status
  retries: 20
  delay: 30
  until:
    - r_pgo_status.resources is defined
    - r_pgo_status.resources | length > 0
    - r_pgo_status.resources[0].status is defined
    - r_pgo_status.resources[0].status.conditions is defined
    - r_pgo_status.resources[0].status.conditions | length > 1
    - r_pgo_status.resources[0].status.conditions[1].status == 'True'
  ignore_errors: true
  when: not delete_deployment|bool
  tags:
    - postgres
    - acm-workload
    - helm