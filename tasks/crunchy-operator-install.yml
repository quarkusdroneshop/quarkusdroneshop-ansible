- name: Retrieve Crunchy Postgres PackageManifest
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    name: crunchy-postgres-operator
    namespace: "{{ project_namespace }}"
  register: crunchy_manifest
  when: not delete_deployment|bool
  tags:
    - postgres
    - helm

- name: Determine latest Crunchy Postgres CSV
  set_fact:
    crunchystartingCSV: "{{ crunchy_manifest | json_query('resources[*].status.channels[?name==`v5`].currentCSV') | first | first }}"
  when: not delete_deployment|bool
  tags:
    - postgres
    - helm

- name: Create Crunchy Postgres for Kubernetes subscription
  kubernetes.core.k8s:
    state: present
    namespace: "{{ project_namespace }}"
    definition: "{{ lookup('template', 'crunchy-postgres-sub.yaml.j2') }}"
  when: not delete_deployment|bool
  tags:
    - postgres
    - helm

# wait for Postgres to be ready
- name: Wait for Crunchy CSV to succeed
  shell: "{{ oc_location }} get csv {{ crunchystartingCSV }} -n {{ project_namespace }} -o json"
  register: csv_status
  changed_when: false
  retries: 30
  delay: 20
  until: (csv_status.stdout | from_json).status.phase == "Succeeded"
  when: not delete_deployment|bool

# CSV が Succeeded になっても PostgresCluster CRD が API discovery に
# 反映されるまでわずかにラグがあるため、CRD 自体の登録も待つ
- name: Wait for PostgresCluster CRD to be registered
  shell: "{{ oc_location }} get crd postgresclusters.postgres-operator.crunchydata.com"
  register: r_pgo_crd
  changed_when: false
  retries: 20
  delay: 15
  until: r_pgo_crd.rc == 0
  when: not delete_deployment|bool

- name: Create Crunchy Postgres database instance
  kubernetes.core.k8s:
    state: present
    namespace: "{{ project_namespace }}"
    apply: true
    definition: "{{ lookup('template', 'crunchy-postgres.yml.j2') }}"
  when: not delete_deployment|bool
  tags:
    - postgres
    - helm

- name: Get a list of all pods from any namespace
  kubernetes.core.k8s_info:
    api_version: postgres-operator.crunchydata.com/v1beta1
    kind: PostgresCluster
    namespace: "{{ project_namespace }}"
  register: pod_list
  when: not delete_deployment|bool
  tags:
    - postgres
    - helm

- name: Print return information from the previous task
  ansible.builtin.debug:
    var: pod_list.resources[0].status.conditions[1].status
    verbosity: 2
  when: not delete_deployment|bool
  tags:
    - postgres
    - helm

# wait for Postgres to be ready
- name: Wait for droneshopdb to be ready
  kubernetes.core.k8s_info:
    api_version: postgres-operator.crunchydata.com/v1beta1
    kind: PostgresCluster
    namespace: "{{ project_namespace }}"
  register: r_pgo_status
  retries: 20
  delay: 30
  until:
    - r_pgo_status.resources is defined
    - r_pgo_status.resources | length > 0
    - r_pgo_status.resources[0].status is defined
    - r_pgo_status.resources[0].status.conditions is defined
    - r_pgo_status.resources[0].status.conditions | length > 1
    - r_pgo_status.resources[0].status.conditions[1].status == 'True'
  ignore_errors: true
  when: not delete_deployment|bool
  tags:
    - postgres
    - helm

- name: Create Crunchy PGAdmin instance 
  kubernetes.core.k8s:
    state: present
    namespace: "{{ project_namespace }}"
    apply: true
    definition: "{{ lookup('template', 'pgadmin.yaml.j2') }}"
  when: not delete_deployment|bool
  tags:
    - postgres
    - helm

- name: retrieve pullsecret
# Newer version of Ansible call this module k8s_info
  kubernetes.core.k8s_info:
    api: v1
    kind: Secret
    name: droneshopdb-pguser-droneshopadmin
    namespace: "{{ project_namespace }}"
  register: databasepassword
  when: not delete_deployment|bool
  tags:
    - postgres
    - helm

- name: Get the original cred secrets
  set_fact:
    original_secret: "{{ item.data.password }}"
  with_items: "{{ databasepassword.resources }}"
  when: not delete_deployment|bool
  no_log: true
  tags:
    - postgres
    - helm

- name: Get postgress password
  set_fact:
    postgres_password: '{{ original_secret| b64decode }}'
  when: not delete_deployment|bool
  tags: 
    - postgres
    - helm

- name: Delete Crunchy Postgres database instance 
  kubernetes.core.k8s:
    state: absent
    namespace: "{{ project_namespace }}"
    definition: "{{ lookup('template', 'crunchy-postgres.yml.j2') }}"
  ignore_errors: true
  when: delete_deployment|bool
  tags: 
    - postgres
    - helm

- name: Remove an droneshopdb-repo-host
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: StatefulSet
    namespace: "{{ project_namespace }}"
    name: droneshopdb-repo-host
  ignore_errors: true
  when:  delete_deployment|bool
  tags: 
    - postgres
    - helm

- name: delete Crunchy Postgres  crd
  command: oc delete csv {{ crunchystartingCSV }} -n "{{ project_namespace }}"
  ignore_errors: true
  when:  delete_deployment|bool
  tags:
    - postgres
    - helm

- name: Remove Crunchy Postgres for Kubernetes subscription
  kubernetes.core.k8s:
    state: absent
    namespace: "openshift-operators"
    definition: "{{ lookup('template', 'crunchy-postgres-sub.yaml.j2') }}"
  ignore_errors: true
  when:  delete_deployment|bool
  tags:
    - postgres
    - helm
  

