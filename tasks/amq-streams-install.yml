---
- name: check if  project {{ project_namespace }} exists
  shell: "{{ oc_location }} get project {{ project_namespace }}"
  register: user_project
  ignore_errors: true
  changed_when: false
  tags:
    - amq
    - acm-workload

- name: create projects 
  command: "{{ oc_location }} adm new-project {{ project_namespace }}"
  when: user_project is failed
  ignore_errors: true 
  tags:
    - amq
    - acm-workload

- name: Create Opeator group
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'operator-group.yaml.j2') }}"
  when: not delete_deployment | bool
  tags: 
  - amq
  - acm-workload
    
- name: Retrieve AMQ Streams PackageManifest
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    name: amq-streams
    namespace: "{{ project_namespace }}"
  register: amq_manifest
  when: not delete_deployment|bool
  tags:
    - amq
    - acm-workload

- name: Determine latest AMQ Streams CSV
  set_fact:
    amqstartingCSV: "{{ amq_manifest | json_query('resources[*].status.channels[?name==`' + amqchannel + '`].currentCSV') | first | first }}"
  when: not delete_deployment|bool
  tags:
    - amq
    - acm-workload

- name: Create AMQ Subscription
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'amq-sub.yaml.j2') }}"
  register: rbac_result
  when: not delete_deployment|bool
  tags:
    - amq
    - acm-workload

- name: Wait for AMQ CRD to be ready
  shell: "{{ oc_location }} get csv -n {{ project_namespace }} -o json"
  register: r_amq_crd_raw
  changed_when: false
  retries: 20
  delay: 60
  until: (r_amq_crd_raw.stdout | from_json | json_query("items[?starts_with(metadata.name, 'amqstreams.') && status.phase=='Succeeded']")) | length == 1
  when: not delete_deployment|bool
  tags:
    - amq
    - acm-workload

- name: Extract AMQ Streams CSV
  set_fact:
    amq_csv_matches: "{{ r_amq_crd_raw.stdout | from_json | json_query(\"items[?starts_with(metadata.name, 'amqstreams.') && status.phase=='Succeeded']\") }}"
  when: not delete_deployment|bool
  tags:
    - amq
    - acm-workload

- name: Display AMQ install status
  debug:
    var: amq_csv_matches
  when: not delete_deployment|bool
  tags:
    - amq
    - acm-workload

- name: fail when AMQ subscription if not ready
  fail:
    msg: "AMQ Streams CSV (amqstreams.*) is not in Succeeded phase in namespace {{ project_namespace }}"
  when: not delete_deployment|bool and (amq_csv_matches | length != 1)
  tags:
    - amq
    - acm-workload

- name: Setting amq installed fact
  set_fact:
    amq_installed: "{{ amq_csv_matches[0].status }}"
  ignore_errors: false
  when: not delete_deployment|bool
  tags:
    - amq
    - acm-workload

- name: Create kafka instance
  kubernetes.core.k8s:
    state: present
    namespace:  "{{ project_namespace }}"
    definition: "{{ lookup('template', 'amq-kafka-instance.yaml.j2') }}"
  when: not delete_deployment|bool
  tags: 
    - amq
    - acm-workload

- name: Search for all Pods labeled shop-cluster-kafka
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ project_namespace }}"
    label_selectors:
      - "strimzi.io/name=shop-cluster-kafka,strimzi.io/broker-role=true"
    field_selectors:
      - status.phase=Running
  register: r_kafka_status
  retries: 200
  delay: 10
  until: r_kafka_status.resources | length == 3
  when: not delete_deployment | bool
  tags:
    - amq
    - acm-workload

- name: Create kafka topics
  kubernetes.core.k8s:
    state: present
    namespace:  "{{ project_namespace }}"
    definition: "{{ lookup('template', 'amq-kafka-topics.yaml.j2') }}"
  when: not delete_deployment|bool
  tags:
    - amq
    - acm-workload

- name: Retrieve AMQ Streams Console PackageManifest
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    name: amq-streams-console
    namespace: "{{ project_namespace }}"
  register: amq_console_manifest
  when: not delete_deployment|bool
  tags:
    - amq
    - acm-workload

- name: Determine latest AMQ Streams Console CSV
  set_fact:
    consolestartingCSV: "{{ amq_console_manifest | json_query('resources[*].status.channels[?name==`' + consolechannel + '`].currentCSV') | first | first }}"
  when: not delete_deployment|bool
  tags:
    - amq
    - acm-workload

- name: Create AMQ Console Subscription
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'amq-console-sub.yaml.j2') }}"
  register: rbac_result
  when: not delete_deployment|bool
  tags:
    - amq
    - acm-workload

- name: Create Kafka Console
  kubernetes.core.k8s:
    state: present
    namespace:  "{{ project_namespace }}"
    definition: "{{ lookup('template', 'amq-kafka-console.yaml.j2') }}"
  when: not delete_deployment|bool
  tags:
    - amq
    - acm-workload

- name: Create Apicurio Registry Subscription
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'apicurio-registry-sub.yaml.j2') }}"
  register: rbac_result
  when: not delete_deployment|bool
  tags: 
    - amq
    - acm-workload

- name: Create Apicurio Registry
  kubernetes.core.k8s:
    state: present
    namespace:  "{{ project_namespace }}"
    definition: "{{ lookup('template', 'apicurio-registry.yaml.j2') }}"
  when: not delete_deployment|bool
  retries: 3
  delay: 60
  tags:
    - amq
    - acm-workload

- name:  Load Registry Schema
  ansible.builtin.script: files/service-registory.sh
  when: not delete_deployment|bool
  tags: 
    - amq
    - acm-workload

- name: Remove kafka topics
  command: "{{ oc_location }}  delete -f {{ config_location }}amq-kafka-topics.yaml"
  ignore_errors: yes
  when: delete_deployment|bool
  tags:
    - amq
    - acm-workload

- name: Remove kafka instance
  kubernetes.core.k8s:
    state: absent
    namespace:  "{{ project_namespace }}"
    definition: "{{ lookup('template', 'amq-kafka-instance.yaml.j2') }}"
  ignore_errors: yes
  when: delete_deployment|bool
  tags:
    - amq
    - acm-workload

- name: Waiting for  kafka instances to be deleted
  shell: |
    set -o pipefail && {{ oc_location }} get pods  -n {{ project_namespace }} | grep Running | grep {{ kafka_cluster_name }} | wc -l
  register: install_status
  when: delete_deployment|bool
  until: "'No resources found' in install_status.stderr or '0' in install_status.stdout"
  retries: 60
  delay: 15
  ignore_errors: yes
  args:
    executable: /bin/bash
  tags:
    - amq
    - acm-workload

- name: Remove AMQ Subscription
  kubernetes.core.k8s:
    state: absent
    definition: "{{ lookup('template', 'amq-sub.yaml.j2') }}"
  ignore_errors: yes
  when: delete_deployment|bool
  tags:
    - amq
    - acm-workload

- name: Remove AMQ Subscription
  command: "{{ oc_location }}  delete -f {{ config_location }}amqstreams.v1.6.1.yaml"
  ignore_errors: yes
  when: delete_deployment|bool
  tags:
    - amq
    - acm-workload

- name: Remove AMQ
  command: "{{ oc_location }}  delete csv {{ amqstartingCSV }} -n {{ project_namespace }}"
  ignore_errors: yes
  when: delete_deployment|bool
  tags: 
    - amq
    - acm-workload